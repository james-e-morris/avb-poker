name: Deploy Planning Poker to GitHub Pages

on:
  push:
    branches:
      - prod
    paths:
      - index.html
      - app.js
      - styles.css
      - ably-config.js
      - .github/workflows/planning-poker-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy folder
        env:
          ABLY_API_KEY: ${{ secrets['ABLY_API_KEY'] }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html app.js styles.css dist/

          # Inject optional Ably key from GitHub secret for realtime mode.
          # If secret is empty, app auto-falls back to demo mode.
          cat > dist/ably-config.js <<EOF
          const ABLY_CONFIG = {
            apiKey: '${ABLY_API_KEY}',
            channelPrefix: 'avb-poker',
            roomTtlMinutes: 120,
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
