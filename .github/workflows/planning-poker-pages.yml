name: Deploy Planning Poker to GitHub Pages

on:
  push:
    branches:
      - prod
    paths:
      - index.html
      - app.js
      - styles.css
      - ably-config.js
      - .github/workflows/planning-poker-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy folder
        env:
          ABLY_API_KEY: ${{ secrets['ABLY_API_KEY'] }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app.js styles.css ably-config.js dist/

          # Inject Ably key from GitHub secret as a hidden window variable.
          # This keeps the key out of version control and prevents exposure in deployed files.
          # If secret is empty, app auto-falls back to demo mode.
          ABLY_KEY_INJECTION=""
          if [ -n "${ABLY_API_KEY}" ]; then
            ABLY_KEY_INJECTION="<script>window.__ABLY_API_KEY__='${ABLY_API_KEY}';</script>"
          fi

          # Insert the injection script right before </head> in index.html
          sed "s|</head>|${ABLY_KEY_INJECTION}</head>|" index.html > dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
